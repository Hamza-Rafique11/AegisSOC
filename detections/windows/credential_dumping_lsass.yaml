id: "AEGIS-WIN-002"
name: "Potential LSASS Memory Access / Credential Dumping"
description: "Identifies processes attempting unauthorized access or memory dumps against Local Security Authority Subsystem Service (lsass.exe)."
category: "windows"
severity: "CRITICAL"
confidence: 94
mitre_tactic: "Credential Access"
mitre_technique: "OS Credential Dumping: LSASS Memory"
mitre_technique_id: "T1003.001"
recommended_response: "Immediately isolate workstation WS-03, terminate originating process, invalidate logged-in Kerberos tickets."
enabled: true
conditions:
  event_type: "process_creation"
  process_name: ["procdump.exe", "rundll32.exe", "mimikatz.exe", "tasklist.exe"]
  command_line_match: ["lsass", "comsvcs.dll", "MiniDump", "sekurlsa"]
